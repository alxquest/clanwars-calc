<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clan Wars Stat Calculator</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <script>
    // GitHub Pages caches index.html, so after a redeploy a returning visitor can
    // boot a stale shell that still points at the previous bundle. The JS and CSS
    // filenames are content-hashed, so comparing the bundle this page loaded
    // against the one the server is serving right now is enough to spot it.
    // Reload at most once per tab so a genuinely stale CDN edge can't loop us.
    (function () {
      var RELOAD_FLAG = 'clanwars-calc:reloaded-for-update';

      function bundleName(text) {
        var match = text.match(/main-[A-Za-z0-9]+\.js/);
        return match ? match[0] : null;
      }

      // If we already came back from a bust, tidy the marker out of the address bar
      // so a copied link never carries it.
      try {
        var here = new URL(window.location.href);
        if (here.searchParams.has('v')) {
          here.searchParams.delete('v');
          history.replaceState(null, '', here.toString());
        }
      } catch (e) {}

      window.addEventListener('load', function () {
        var loadedScript = document.querySelector('script[src*="main-"]');
        if (!loadedScript || !window.fetch) {
          return;
        }

        var loaded = bundleName(loadedScript.getAttribute('src') || '');
        if (!loaded) {
          return;
        }

        fetch('index.html?cachebust=' + Date.now(), { cache: 'no-store' })
          .then(function (response) { return response.ok ? response.text() : null; })
          .then(function (html) {
            if (!html) {
              return;
            }

            var deployed = bundleName(html);
            if (!deployed || deployed === loaded) {
              try { sessionStorage.removeItem(RELOAD_FLAG); } catch (e) {}
              return;
            }

            try {
              if (sessionStorage.getItem(RELOAD_FLAG)) {
                return;
              }
              sessionStorage.setItem(RELOAD_FLAG, '1');
            } catch (e) {
              return;
            }

            // location.reload() only revalidates, and a CDN edge can answer with the
            // same stale document. Navigating to a URL the cache has never seen
            // cannot be served from it. The marker is the deployed bundle's hash, so
            // it stays stable per release rather than changing on every load.
            try {
              var target = new URL(window.location.href);
              target.searchParams.set('v', deployed.replace(/^main-|\.js$/g, ''));
              location.replace(target.toString());
            } catch (e) {
              location.reload();
            }
          })
          .catch(function () {});
      });
    })();
  </script>
</body>
</html>
